[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "push-any-letter"
version = "0.1.0"
description = "A local 2D letter-pushing simulator with a Gymnasium API"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Lixin Xu"}]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<2", "pymunk>=6.8,<7", "pygame>=2.5,<3",
  "shapely>=2.0,<2.1", "fonttools>=4.40,<5",
  "mapbox-earcut>=1.0,<2", "gymnasium>=1.0,<1.1"
]

[project.optional-dependencies]
train = ["torch>=2.8,<3", "matplotlib>=3.8,<4", "huggingface_hub>=0.35,<2"]
data = ["huggingface_hub>=0.35,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
push-any-letter = "push_any_letter.app:main"

[tool.setuptools.packages.find]
include = ["push_any_letter*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
